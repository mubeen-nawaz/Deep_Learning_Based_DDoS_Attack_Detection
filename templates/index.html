<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel | Network IDS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        @keyframes pulse-red { 0%, 100% { background-color: #111827; } 50% { background-color: #7f1d1d; } }
        .attack-bg { animation: pulse-red 1s infinite; }
        .glitch { animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 20% { transform: translate(-3px, 0px); } 100% { transform: translate(1px, -1px); } }
    </style>
</head>
<body id="mainBody" class="bg-gray-900 text-white transition-colors duration-500 font-sans">
    
    <div class="container mx-auto p-6">
        <header class="flex justify-between items-center border-b border-gray-700 pb-4 mb-8">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-blue-400">SENTINEL <span class="text-white">IDS</span></h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest">LSTM-Based Neural Detection</p>
            </div>
            <div id="statusBadge" class="px-4 py-1 rounded-full bg-green-500/20 text-green-400 text-sm font-bold border border-green-500/50">
                SYSTEM SECURE
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-2xl">
                <h3 class="text-lg font-bold mb-4">Real-time Traffic Load</h3>
                <canvas id="trafficChart" height="150"></canvas>
            </div>

            <div id="threatPanel" class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-2xl overflow-hidden relative">
                <h3 class="text-lg font-bold mb-4">Latest Threat Intel</h3>
                <div id="intelLog" class="space-y-3 text-sm h-64 overflow-y-auto">
                    <p class="text-gray-500 italic">Listening for network packets...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const body = document.getElementById('mainBody');
        const badge = document.getElementById('statusBadge');
        const intelLog = document.getElementById('intelLog');

        // Initialize Real-time Chart
        const ctx = document.getElementById('trafficChart').getContext('2d');
        const trafficChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Traffic Magnitude', data: [], borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' }] },
            options: { scales: { y: { beginAtZero: true, grid: { color: '#374151' } }, x: { display: false } }, plugins: { legend: { display: false } } }
        });

        socket.on('traffic_update', (data) => {
            updateDashboard(data, false);
        });

        socket.on('ddos_alert', (data) => {
            updateDashboard(data, true);
        });

        function updateDashboard(data, isAttack) {
            // Update Chart
            if (trafficChart.data.labels.length > 20) {
                trafficChart.data.labels.shift();
                trafficChart.data.datasets[0].data.shift();
            }
            trafficChart.data.labels.push("");
            trafficChart.data.datasets[0].data.push(isAttack ? 100 : Math.random() * 20 + 10);
            trafficChart.data.datasets[0].borderColor = isAttack ? '#ef4444' : '#3b82f6';
            trafficChart.update();

            if (isAttack) {
                body.classList.add('attack-bg', 'glitch');
                badge.className = "px-4 py-1 rounded-full bg-red-600 text-white text-sm font-bold animate-pulse";
                badge.innerText = "🚨 ATTACK DETECTED";
                
                const entry = document.createElement('div');
                entry.className = "p-3 bg-red-500/20 border-l-4 border-red-500 rounded";
                entry.innerHTML = `<strong>DDoS Alert</strong><br>From: ${data.src_ip}<br><span class="text-xs">Prob: ${(data.probability*100).toFixed(1)}%</span>`;
                intelLog.prepend(entry);
            } else {
                body.classList.remove('attack-bg', 'glitch');
                badge.className = "px-4 py-1 rounded-full bg-green-500/20 text-green-400 text-sm font-bold border border-green-500/50";
                badge.innerText = "SYSTEM SECURE";
            }
        }
    </script>
</body>
</html>
